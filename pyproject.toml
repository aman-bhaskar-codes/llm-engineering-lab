[project]
name = "structured-extraction-engine"
version = "0.1.0"
description = "A structured extraction engine using LLMs with FastAPI"
authors = [{ name = "Aman Bhaskar" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "openai",
    "instructor",
    "google-genai",
    "jsonref",
    "google-generativeai>=0.8.6",
    "python-dotenv>=1.2.2",
    "pypdf>=6.9.1",
    "pillow>=12.1.1",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
