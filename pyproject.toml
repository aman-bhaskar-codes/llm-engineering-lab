[project]
name = "structured-extraction-engine"
version = "0.1.0"
description = "A structured extraction engine using LLMs with FastAPI"
authors = [{ name = "Aman Bhaskar" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "SQLAlchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "openai",
    "instructor",
    "google-genai",
    "jsonref",
    "google-generativeai>=0.8.6",
    "python-dotenv>=1.2.2",
    "pypdf>=6.9.1",
    "pillow>=12.1.1",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "python-multipart>=0.0.22",
    "claude>=0.4.11",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "tenacity>=9.1.4",
    "neo4j>=5.0.0",
    "redis[hiredis]>=5.0.1",
    "loguru>=0.7.2",
    "greenlet>=3.0.0",
    "email-validator>=2.1.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pgvector>=0.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
